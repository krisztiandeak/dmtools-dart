name: Quality

# Dispatch-only CI (2026-09 machine-loop redesign): pushes fire NO CI —
# the SM (machine-sm.yml → factory-sm) is the only trigger. It dispatches
# this workflow on the PR head when validation is due (sm rule
# validate-fresh / validate-armed), so intermediate dev/rework pushes and
# silent branch updates are free. Required checks still match: the
# dispatched run registers its check runs on the head SHA.
# Main keeps its push CI (badges + history).
on:
  workflow_dispatch: {}

concurrency:
  # PR branches: a fresh dispatch supersedes the in-flight run. Main keeps
  # every run (badges + history).
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pick:
    # Resolves dmtools-agents SHA once per run (gh-437).
    runs-on: ubuntu-slim
    outputs:
      runner: ubuntu-24.04
      agents_sha: ${{ steps.agents.outputs.sha }}
    permissions:
      contents: read
    steps:
      - name: Resolve dmtools-agents SHA once per run (gh-437)
        # Every job of this run fetches agents at THIS commit, so the
        # agents-gate partition check cannot race with a commit landing
        # on agents main mid-run. Outputs persist across attempts, so a
        # rerun of a failed job reuses the same SHA.
        id: agents
        run: |
          SHA=$(git ls-remote https://github.com/IstiN/dmtools-agents.git refs/heads/main | cut -f1)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve dmtools-agents main"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### dmtools-agents SHA: \`${SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "[quality] dmtools-agents pinned for this run: $SHA"

  static:
    # Fast lane: format + analyze need no toolchain (gcc/QuickJS) — they
    # finish in ~2 min and fail the pipeline early on style/type errors.
    runs-on: ubuntu-slim
    steps:
      - name: Runner disk hygiene
        # Bitrise pool machines accumulate per-run workdirs; twice on
        # 2026-09-26 a full disk killed agents-suite mid-run. Drop stale
        # dirs (>1 day) before checkout. Never touches the current
        # workspace; fresh mtimes protect concurrently running jobs.
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze

  test:
    # The suite (~2.3k tests) is sharded 4 ways — wall time drops from
    # ~17 min serial to ~5-6 min (fixed per-shard overhead ~3 min +
    # suite/4). Each shard uploads its partial lcov + test count; the
    # gate job merges them. Bitrise pool first (owner 2026-10-15): the
    # 4-shard suite is the wall-time pole — same dispatch shape as the
    # agents-suite below; falls back to ubuntu-24.04 when the pool is down.
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    # gh-440: a synchronously-wedged test isolate never trips dart test's
    # per-test timeout; bound the whole shard so it dies in minutes.
    # Scope: the WHOLE job (checkout, apt, QuickJS build, dart test,
    # coverage) — not just the test step. Normal shards finish in 8-20 min,
    # so 45 leaves ample headroom.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TOTAL_SHARDS: 4
    steps:
      - name: Runner disk hygiene
        # Bitrise pool machines accumulate per-run workdirs; twice on
        # 2026-09-26 a full disk killed agents-suite mid-run. Drop stale
        # dirs (>1 day) before checkout. Never touches the current
        # workspace; fresh mtimes protect concurrently running jobs.
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
      - name: Fetch dmtools-agents (run SHA, no submodule pin)
        env:
          AGENTS_FETCH_REF: ${{ needs.pick.outputs.agents_sha }}
        run: bash tool/fetch_agents.sh
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - run: dart pub get
      - name: Install gcc
        run: |
          # apt hung twice on 2026-08-19 (no exit — jobs burned 19+ minutes on
          # this step before manual cancellation). Cap each attempt and retry
          # so a flaky mirror fails the job fast instead of stalling it.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -qq && \
               timeout 300 sudo apt-get install -y -qq gcc; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying in 15s"
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "apt failed after 3 attempts"
          exit 1
      - name: Cache QuickJS shared library
        uses: actions/cache@v4
        with:
          path: native/quickjs
          key: quickjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
      - name: Build QuickJS (quickjs_runtime package)
        run: |
          if [ -s native/quickjs/libquickjs_bridge.so ]; then
            echo "Using cached native/quickjs/libquickjs_bridge.so"
            exit 0
          fi
          PKG=$(python3 -c "import json;print([p['rootUri'] for p in json.load(open('.dart_tool/package_config.json'))['packages'] if p['name']=='quickjs_runtime'][0].replace('file://',''))")
          bash "$PKG/tool/build_quickjs.sh"
      - name: dart test (shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}) --coverage
        id: test
        # pipefail keeps a red shard red through the tee; the captured count
        # feeds the badges step (summed across shards in the gate job).
        # --reporter compact: on CI dart test auto-selects the github
        # reporter, which has no +N counters and would leave COUNT empty
        # (grep exits 1, bash -e kills the step).
        run: |
          set -o pipefail
          # gh-445: the watchdog kills a wedged run after STALL_MINUTES of
          # no progress and writes stall_diagnosis.txt naming the REAL
          # wedged suite/test (the compact line on screen is just the last
          # event of any concurrent suite) + per-isolate VM-service state.
          sudo apt-get install -y -qq gdb >/dev/null 2>&1 || true
          STALL_MINUTES=8 WATCHDOG_DIR=/tmp/test_watchdog \
            bash tool/ci_test_watchdog.sh --coverage=coverage --reporter compact \
            --total-shards "$TOTAL_SHARDS" --shard-index "${{ matrix.shard }}" \
            2>&1 | tee /tmp/test_run.log
          COUNT=$(grep -oE '\+[0-9]+' /tmp/test_run.log | tail -1 | tr -d '+' || true)
          echo "test_count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
      - name: Stall evidence (failed or timed-out shard)
        # gh-440: runs only when the test step itself FAILED or was
        # CANCELLED (job timeout). A skipped test step (earlier step red,
        # e.g. apt/QuickJS) has no /tmp/test_run.log to show — skip.
        if: always() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled')
        run: |
          {
            echo "### test shard ${{ matrix.shard }} — last 100 reporter lines"
            echo '```'
            tail -n 100 /tmp/test_run.log 2>/dev/null || echo '(no log captured)'
            echo '```'
            if [ -s /tmp/test_watchdog/stall_diagnosis.txt ]; then
              echo "### stall diagnosis (gh-445)"
              echo '```'
              head -c 60000 /tmp/test_watchdog/stall_diagnosis.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled')
        with:
          name: test-shard-${{ matrix.shard }}-log
          path: |
            /tmp/test_run.log
            /tmp/test_watchdog/
          if-no-files-found: warn
          retention-days: 7
      - run: dart pub global activate coverage
      - name: Format coverage (shard)
        # Prune non-report vm.json stubs: a tag-excluded (skipped) test
        # file still emits a vm.json that is NOT a coverage report (shape
        # varies by SDK — seen {}, richer keyless maps, even unparseable
        # bytes), and format_coverage hard-fails on it. Keep ONLY files
        # that parse to a dict with a `coverage` list; everything else is
        # logged and dropped. The prune cannot fail the step by
        # construction (every failure lands in the else branch).
        run: |
          find coverage -name '*.vm.json' | while IFS= read -r f; do
            if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(d,dict) and isinstance(d.get("coverage"),list) else 1)' "$f" 2>/dev/null; then
              :
            else
              echo "prune: $f ($(wc -c <"$f") bytes, not a coverage report)"
              rm -f "$f"
            fi
          done
          dart pub global run coverage:format_coverage \
            --lcov --in coverage --out coverage/lcov.info --report-on lib
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 1
      - name: Upload shard test count
        run: echo "${{ steps.test.outputs.test_count }}" > shard_count.txt
      - uses: actions/upload-artifact@v4
        with:
          name: count-${{ matrix.shard }}
          path: shard_count.txt
          retention-days: 1

  gate:
    # Single merge point: full coverage lcov + total test count restored
    # from the shards, then the crap4dart gates and the badges. Required
    # status check.
    #
    # Enforcement path (review thread 1): a `needs:`-dependent job whose
    # dependency fails reports `skipped`, and skipped counts as a
    # SUCCESSFUL status for required checks. Today quality.yml is
    # dispatch-only (the SM tick stamps required contexts from the run
    # outcome), but this job must also go RED on its own: `if: always()`
    # + the result guard below keep the shape safe if a `pull_request`
    # trigger is ever added.
    needs: [static, test]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Fail unless static and test both succeeded
        if: needs.static.result != 'success' || needs.test.result != 'success'
        run: |
          echo "static result: ${{ needs.static.result }}; test result: ${{ needs.test.result }}" >&2
          exit 1
      - name: Runner disk hygiene
        if: needs.static.result == 'success' && needs.test.result == 'success'
        # Bitrise pool machines accumulate per-run workdirs; twice on
        # 2026-09-26 a full disk killed agents-suite mid-run. Drop stale
        # dirs (>1 day) before checkout. Never touches the current
        # workspace; fresh mtimes protect concurrently running jobs.
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
        if: needs.static.result == 'success' && needs.test.result == 'success'
      - uses: actions/download-artifact@v4
        if: needs.static.result == 'success' && needs.test.result == 'success'
        with:
          pattern: lcov-*
          path: coverage-shards
      - uses: actions/download-artifact@v4
        if: needs.static.result == 'success' && needs.test.result == 'success'
        with:
          pattern: count-*
          path: shard-counts
      - name: Merge shard coverage
        if: needs.static.result == 'success' && needs.test.result == 'success'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          mkdir -p coverage
          ARGS=$(for f in coverage-shards/lcov-*/lcov.info; do printf -- '-a %s ' "$f"; done)
          # shellcheck disable=SC2086
          lcov $ARGS -o coverage/lcov.info
      - name: Sum shard test counts
        id: counts
        if: needs.static.result == 'success' && needs.test.result == 'success'
        run: |
          TOTAL=$(cat shard-counts/count-*/shard_count.txt | awk '{s+=$1} END{print s+0}')
          echo "test_count=$TOTAL" >> "$GITHUB_OUTPUT"
      - name: Install crap4dart
        if: needs.static.result == 'success' && needs.test.result == 'success'
        # Download prebuilt crap4dart-linux-x64 release binary (no Dart SDK needed).
        run: |
          CRAP_VER=v0.17.0
          curl -fsSL "https://github.com/IstiN/crap4dart/releases/download/${CRAP_VER}/crap4dart-linux-x64" -o /tmp/crap4dart
          chmod +x /tmp/crap4dart
          sudo mv /tmp/crap4dart /usr/local/bin/crap4dart
          crap4dart --version
      - run: crap4dart check --all
        if: needs.static.result == 'success' && needs.test.result == 'success'
      - run: crap4dart analyze
        if: needs.static.result == 'success' && needs.test.result == 'success'
      - name: Generate badges
        if: needs.static.result == 'success' && needs.test.result == 'success'
        run: |
          mkdir -p .badges
          TEST_COUNT="${{ steps.counts.outputs.test_count }}"
          COV_PCT=$(grep -o 'LH:[0-9]*' coverage/lcov.info | awk -F: '{s+=$2} END{print s}')
          COV_TOTAL=$(grep -o 'LF:[0-9]*' coverage/lcov.info | awk -F: '{s+=$2} END{print s}')
          COV_FINAL=$(echo "scale=1; $COV_PCT * 100 / $COV_TOTAL" | bc 2>/dev/null || echo "0")
          CRAP="8.0"

          # shields.io flakes (503/connection blips) must not red the whole
          # pipeline — badges are cosmetic. Retry, then warn and move on
          # (the commit step already tolerates missing files).
          fetch_badge() {
            local url="$1" out="$2" attempt
            for attempt in 1 2 3; do
              if wget -q -O "$out" "$url"; then return 0; fi
              sleep 5
            done
            echo "::warning::badge fetch failed after 3 attempts: $url"
          }

          # Tests badge
          fetch_badge \
            "https://img.shields.io/badge/tests-${TEST_COUNT}%20passing-brightgreen" \
            .badges/tests.svg
          # Coverage badge
          fetch_badge \
            "https://img.shields.io/badge/coverage-${COV_FINAL}%25-brightgreen" \
            .badges/coverage.svg
          # crap4dart badge
          fetch_badge \
            "https://img.shields.io/badge/crap4dart-${CRAP}%20threshold-green" \
            .badges/crap4dart.svg
      - name: Commit badges
        # Badges belong to main only — on PR branches this step would push a
        # stray bot commit to the feature branch mid-review.
        if: needs.static.result == 'success' && needs.test.result == 'success' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .badges/*.svg || true
          git diff --staged --quiet || git commit -m 'chore: update CI badges [skip ci]'
          git push || true

  agents-suite:
    # gh-315: the suite (92 files, 917 tests) runs in ONE sequential QuickJS
    # engine — 11m44s of wall time, the quality pipeline's long pole. It is
    # now sharded the same way dart test already is: each matrix shard
    # plans its round-robin subset (ShardPlanner), pre-flights that every
    # planned file exists and is non-empty (testRunner.js would silently
    # skip unreadable files — pre-flight turns that into a hard red), runs
    # the subset through the UNMODIFIED testRunner.js, and uploads a JSON
    # manifest of its result. fail-fast: false so every shard reports; a
    # re-dispatch retries the whole matrix (concurrency group semantics).
    #
    # N is a workflow-level constant: bump matrix + TOTAL_SHARDS together.
    # N=6, not the proposed 4: round-robin balances the file COUNT (23/23/
    # 23/23 @ N=4), but test_smAgent.js' quarter of the list carries ~47%
    # of the tests (measured shard 0 @ N=4: 432 of 917) — a 4-way split
    # keeps a ~5.5 min pole and blows the <=7 min budget once agents-gate
    # is added. Static per-file test counts (exact against the measured
    # shard) give max-shard shares of 34% @ N=4, 24% @ N=6, 22% @ N=8;
    # N=6 keeps the pole at ~4 min while adding only 2 extra jobs beyond
    # the proposal (13 total). If the Bitrise pool cannot host them, shards
    # queue — wall time degrades gracefully, correctness is unaffected.
    # Bitrise pool first (owner 2026-10-13): the 6-shard suite is the
    # pipeline's long pole — hosted slots serialized it behind the whole
    # gate. The workflow comment below already anticipated pool hosting.
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    timeout-minutes: 45  # gh-440: bounded wedge, see test job
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      TOTAL_SHARDS: 6
    steps:
      - name: Runner disk hygiene
        # Bitrise pool machines accumulate per-run workdirs; twice on
        # 2026-09-26 a full disk killed agents-suite mid-run. Drop stale
        # dirs (>1 day) before checkout. Never touches the current
        # workspace; fresh mtimes protect concurrently running jobs.
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
      - name: Fetch dmtools-agents (run SHA — L4 suite)
        env:
          AGENTS_FETCH_REF: ${{ needs.pick.outputs.agents_sha }}
        run: bash tool/fetch_agents.sh
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - run: dart pub get
      - name: Install gcc
        run: |
          # apt hung twice on 2026-08-19 (no exit — jobs burned 19+ minutes on
          # this step before manual cancellation). Cap each attempt and retry
          # so a flaky mirror fails the job fast instead of stalling it.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -qq && \
               timeout 300 sudo apt-get install -y -qq gcc; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying in 15s"
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "apt failed after 3 attempts"
          exit 1
      - name: Cache QuickJS shared library
        uses: actions/cache@v4
        with:
          path: native/quickjs
          key: quickjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
      - name: Build QuickJS (quickjs_runtime package)
        run: |
          if [ -s native/quickjs/libquickjs_bridge.so ]; then
            echo "Using cached native/quickjs/libquickjs_bridge.so"
            exit 0
          fi
          PKG=$(python3 -c "import json;print([p['rootUri'] for p in json.load(open('.dart_tool/package_config.json'))['packages'] if p['name']=='quickjs_runtime'][0].replace('file://',''))")
          bash "$PKG/tool/build_quickjs.sh"
      # Pinned via the agents/ submodule instead of a floating clone so the
      # suite state is reproducible per commit. The suite hard-gates: the
      # runner requires a well-formed, fully-passing result per shard.
      - name: Run agents test suite (shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }})
        run: |
          dart run bin/run_agents_suite.dart agents \
            --shard-index "${{ matrix.shard }}" \
            --total-shards "$TOTAL_SHARDS" \
            --manifest-out "agents-suite-shard/manifest-${{ matrix.shard }}.json"
      # The manifest is machine-written JSON from our own runner (paths +
      # counts only) — the agents-gate merge job parses it, never evals it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-manifest-${{ matrix.shard }}
          path: agents-suite-shard/manifest-${{ matrix.shard }}.json
          retention-days: 1

  agents-gate:
    # gh-315: single merge point for the sharded agents suite — mirrors the
    # `gate` job that merges lcov shards. The merge additionally fails on
    # partition defects: the multiset of planned files across the
    # downloaded manifests must equal run_all.json's testFiles exactly (a
    # lost or duplicated file is red, not a silent green with fewer
    # tests), and every manifest must report a fully-passing shard.
    # Manifests are parsed as data, never evaled. Required status check
    # (like `gate`).
    #
    # Enforcement path (review thread 1): a `needs:`-dependent job whose
    # dependency fails reports `skipped`, and skipped counts as a
    # SUCCESSFUL status for required checks. Today the gate is still
    # protected run-level (dispatch-only workflow → SM validate → tick
    # stamping), but this job must also go RED on its own: `if: always()`
    # + the result guard below make a red/cancelled shard produce a red
    # required check, so the shape stays safe if a `pull_request` trigger
    # is ever added.
    needs: [pick, agents-suite]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Fail unless every shard succeeded
        if: needs.agents-suite.result != 'success'
        run: |
          echo "agents-suite result: ${{ needs.agents-suite.result }}" >&2
          exit 1
      - name: Runner disk hygiene
        if: needs.agents-suite.result == 'success'
        run: |
          df -h / || true
          WS_PARENT="$(dirname "$RUNNER_WORKSPACE")"
          CUR="$(basename "$RUNNER_WORKSPACE")"
          find "$WS_PARENT" -maxdepth 1 -mindepth 1 -type d ! -name "$CUR" -mtime +1 -exec rm -rf {} + 2>/dev/null || true
          find "$WS_PARENT/_temp" -mindepth 1 -mtime +1 -delete 2>/dev/null || true
          df -h / || true
      - uses: actions/checkout@v4
        if: needs.agents-suite.result == 'success'
      - name: Fetch dmtools-agents (run SHA, no submodule pin)
        if: needs.agents-suite.result == 'success'
        env:
          AGENTS_FETCH_REF: ${{ needs.pick.outputs.agents_sha }}
        run: bash tool/fetch_agents.sh
      - uses: dart-lang/setup-dart@v1
        if: needs.agents-suite.result == 'success'
        with:
          sdk: stable
      - name: Cache pub packages
        if: needs.agents-suite.result == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - run: dart pub get
        if: needs.agents-suite.result == 'success'
      - uses: actions/download-artifact@v4
        if: needs.agents-suite.result == 'success'
        with:
          pattern: agents-manifest-*
          path: agents-manifests
      - name: Merge shard manifests (partition + all-green)
        if: needs.agents-suite.result == 'success'
        run: |
          dart run scripts/agents_shard_gate.dart \
            agents-manifests agents/js/unit-tests/run_all.json
