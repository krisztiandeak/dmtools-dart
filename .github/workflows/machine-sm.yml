# Machine SM — thin stub over the FROZEN machine loop
# (IstiN/dmtools-agentic-workflows, reusable).
#
# The whole reconcile tick (version resolution, dmtools install, pack
# run) lives in IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm.yml.
# This file carries only the triggers (cron + manual dry dispatch) and the
# call. NO caller-side concurrency: the factory owns the `machine-sm`
# group — a caller declaring the same group deadlocks the called workflow
# (it waits forever on a group its own caller holds).

name: 'Machine SM'

run-name: >-
  🧹 SM ${{
    github.event_name == 'workflow_dispatch' && 'manual tick' ||
    format('tick {0}', github.event.schedule || '') }}${{
  github.event.inputs.dryRun == 'true' && ' (dry)' || '' }}

on:
  schedule:
    - cron: '*/10 * * * *'   # short ticks — the engine idles when busy
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Log the plan, perform no action'
        required: false
        type: boolean
        default: true


permissions:
  contents: write         # checkout + silent update-branch pushes
  issues: write           # labels + close-issue safety net
  pull-requests: write    # update-branch + merge
  checks: write           # bridge-free validation stamps (factory #510)
  actions: write          # workflow_dispatch on the teammate workflow

jobs:
  pick:
    # Bitrise-first picker (owner 2026-10-13): the pool is preferred, but a
    # dead/paused pool must never park the machine on "queued forever".
    # Canary: dispatch the short-capped pool probe and poll briefly; the
    # probe answering fast = pool alive -> pool. Any other outcome (no
    # pickup within the window, red, dispatch failure) -> GitHub-hosted.
    # Worst-case added latency when the pool is down: ~90s once per run.
    # ubuntu-slim: separate hosted capacity class — the picker must not
    # queue behind heavy ubuntu-latest load (fa release validations etc.);
    # it only runs gh calls (~90s).
    runs-on: ubuntu-slim
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Canary the Bitrise pool, else fall back to GitHub-hosted
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gh; }
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run bitrise-probe.yml --ref "$GITHUB_REF_NAME" || true
          VERDICT=no-pickup
          RUNNER=ubuntu-24.04
          for i in $(seq 1 9); do
            sleep 10
            R=$(gh run list --workflow bitrise-probe.yml --created ">$TS" \
                 --limit 1 --json status,conclusion \
                 --jq '.[0] | "\(.status)/\(.conclusion // "-")"' 2>/dev/null || echo none)
            case "$R" in
              completed/success) VERDICT=pool-up;   RUNNER=bitrise-runner-dmtools-ci; break ;;
              completed/*)       VERDICT=pool-red;  break ;;
            esac
          done
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "picker: $VERDICT -> $RUNNER"

  sweep-check-runs:
    # Orphaned-check-run janitor (autonomy, 2026-10-14): when a validation
    # run concludes but a job check-run stays `in_progress` (attempt races,
    # superseded dispatches), the SM's hasActiveHeadRun probe reads
    # "still running" forever — no failure verdict, no rework leg, the PR
    # deadlocks (live: #402 held 3h by 15:11 zombies). Only the creator
    # identity may PATCH a check-run, so the sweep runs HERE, under
    # github.token (github-actions[bot] created the job check-runs).
    # For every open PR head: the LATEST Quality run on that head, once
    # completed, donates its per-job conclusions to any still-hanging
    # static/gate/agents-gate check-runs. Skip while the run is active —
    # the guard must stay truthful. No-op when states agree.
    runs-on: ubuntu-slim
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh pr list -R "$GITHUB_REPOSITORY" --state open --json headRefOid --jq '.[].headRefOid' | sort -u); do
            latest=$(gh run list -R "$GITHUB_REPOSITORY" --commit "$sha" --json databaseId,status,conclusion,workflowName --jq '[.[] | select(.workflowName=="Quality")] | sort_by(.databaseId) | reverse | .[0] // empty') || continue
            [ -n "$latest" ] || continue
            [ "$(echo "$latest" | jq -r .status)" = "completed" ] || continue
            rid=$(echo "$latest" | jq -r .databaseId)
            jobs_json=$(gh run view "$rid" -R "$GITHUB_REPOSITORY" --json jobs)
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?status=in_progress&per_page=100" --jq '.check_runs[] | select(.name=="static" or .name=="gate" or .name=="agents-gate") | .id' | while read -r crid; do
              name=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$crid" --jq .name)
              concl=$(echo "$jobs_json" | jq -r --arg n "$name" '[.jobs[] | select(.name==$n)][0].conclusion // "failure"')
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$crid" -f status=completed -f conclusion="$concl" --jq '"sweep: \(.name) -> \(.conclusion)"' || echo "sweep: could not complete $name ($crid)" >&2
            done
          done
          echo "sweep: done"

  sm:
    needs: pick
    # Machine loop — tracks IstiN/dmtools-agentic-workflows main
    # (always-latest policy, owner directive 2026-10-04: fixes go live on
    # merge; awf pushes stay review-gated). Agent code and the dmtools CLI
    # are NOT tied to this ref: they resolve from RELEASES at run time by
    # repo variables (bump = repo-settings edit, zero workflow changes):
    #   vars.AGENTS_VERSION  — dmtools-agents release tag ('latest' default)
    #   vars.DMTOOLS_VERSION — dmtools-dart CLI release tag ('latest' default)
    # Guarded by test/machine_kit/factory_stub_ref_test.dart.
    uses: IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm.yml@main
    with:
      # Bitrise Build Hub pool (epam-org visible; probe #229).
      runner: ${{ needs.pick.outputs.runner }}
      # Bridge-free mode (factory #510): the tick stamps the three required
      # protection checks itself — the sm-validation bridge is deleted.
      # gh-315: the sharded agents suite merges in `agents-gate` (the
      # matrix shards themselves are not required contexts, same as `test`).
      validation-checks: '["agents-gate","static","gate"]'
      # Factory-state snapshot → factory-data branch (board: dmtools-factory)
      state-publish: '{"channel":"release","tag":"factory-data","asset":"dart-state.json"}'
      # Parallel READ fan-out inside the tick (dmtools-agents#559): wires the
      # Dart runtime's runAsync worker pool into the SM engine — per-PR/issue
      # enrichment + dispatched-CI probes fan out over 4 workers; '0' would
      # take the sequential fallback. Actions stay sequential on the main
      # engine either way.
      parallel-workers: '4'
      # sm_github.json validation rules (validate-armed etc.) dispatch and
      # stamp THIS workflow on PR heads — without it the required contexts
      # (agents-gate/static/gate, produced by quality.yml jobs) never
      # appear and approved PRs stall BLOCKED (issue dmtools-agents#575,
      # live: PR #301 needed a manual Quality dispatch 2026-09-29).
      ci-workflow: quality.yml
      # Manual ticks default to dry; cron ticks run live.
      dryRun: ${{ github.event.inputs.dryRun || 'false' }}
      # #687: the workflow token — silent branch updates (pushes trigger
      # no workflows). Input channel: secrets-block mapping of github.token
      # arrives EMPTY through a reusable call (live-verified in fa); it
      # rides this INPUT instead (fa machine-sm.yml parity).
      silent-token: ${{ github.token }}
    # Explicit mapping — the factory DECLARES SOURCE_GITHUB_TOKEN as a
    # required named secret (plus optional SILENT_GH_TOKEN), and
    # `secrets: inherit` does not satisfy required-secret validation at
    # call time (live bisect: inherit => startup failure, explicit => green).
    secrets:
      # EXACTLY the set factory-sm.yml declares — mapping a secret the
      # callee does not declare is rejected at call time, a missing
      # declared one fails the guard test.
      SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
      # Optional repo secret; unset → empty → the factory falls back to
      # the silent-token input above (github.token), which is the working
      # route for silent updates anyway.
      SILENT_GH_TOKEN: ${{ secrets.SILENT_GH_TOKEN }}
