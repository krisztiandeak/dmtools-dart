# crap4dart configuration.
# See https://github.com/IstiN/crap4dart for details.

# Directories scanned for Dart sources by "analyze" and "check"
# (default mode, without --changed/--staged).
# GOAL.md: test code is held to the same bar.
sources: [lib, bin, test]

# Files excluded from analysis in every mode (glob patterns relative
# to the project root).
# exclude: ['example/**', 'tool/**', '**.g.dart']

# CRAP metric analysis settings ("analyze" command).
crap:
  # Enable CRAP analysis; when false, "analyze" exits immediately.
  enabled: true
  # Maximum allowed CRAP score; higher scores fail the run.
  threshold: 8.0
  # Run the test suite to generate coverage before analyzing.
  run_tests: false
  # Count branches inside lambdas towards the enclosing method's
  # cyclomatic complexity.
  # count_lambdas: true

# Coverage input settings.
coverage:
  # Path to the LCOV coverage file, relative to the project root.
  lcov_path: coverage/lcov.info
  # Run "dart test --coverage" / "flutter test --coverage" before analyzing.
  run_tests: false
  # Fail when no coverage data is available instead of reporting N/A.
  required: true
  # Report branch coverage (BRDA records) in addition to line coverage.
  branch_coverage: true

# Quality gates ("check" command).
gates:
  # Limit file size in lines of code.
  loc:
    enabled: true
    # Maximum lines per file.
    max_lines: 800
    # Glob patterns excluded from the gate.
    exclude:
      - '**.g.dart'
      - '**.freezed.dart'
      - '**.mocks.dart'
  # Enforce a minimum test coverage percentage.
  test_coverage:
    enabled: true
    # Minimum required coverage percent.
    min_percent: 80.0
    # Apply the minimum per file instead of to the project total.
    per_file: false
    # Directories whose files count towards the coverage aggregate.
    dirs: [lib]
  # Enforce golden (screenshot) tests for widgets (Flutter projects).
  golden:
    enabled: true
    # Minimum percentage of widgets with a matching golden test.
    min_widget_coverage: 80.0
    # Directories scanned for widgets.
    widget_dirs: [lib]
    # Directories scanned for golden tests.
    test_dirs: [test]
    # Widget class names excluded from the gate.
    exclude_widgets: []
  # Forbid hardcoded user-visible strings in widget parameters.
  hardcoded_strings:
    enabled: true
    # Comment marker that suppresses the gate on a line.
    ignore_marker: 'l10n:ignore'
    # Widget parameter names that must not contain hardcoded strings.
    check_params: [labelText, hintText, helperText, tooltip]
  # Require semantics labels on interactive widgets (Flutter projects).
  accessibility:
    enabled: true
    # Widget types that must provide a semantics label.
    require_label_for: [IconButton, Image, GestureDetector, InkWell]
  # Limit cyclomatic complexity per method.
  complexity:
    enabled: true
    # Maximum allowed cyclomatic complexity.
    max_complexity: 10
    # Count branches inside lambdas towards the enclosing method.
    # count_lambdas: true
  # Limit method size and signature length.
  method_size:
    enabled: true
    # Maximum lines per method body.
    max_lines: 60
    # Maximum number of parameters per method.
    max_params: 6
    # The TestRail case-creation methods mirror the Java @MCPParam
    # signatures 1:1 (createCaseDetailed takes 10 @MCPParam arguments in
    # dm.ai's TestRailClient.java; Java source is the spec per AGENTS.md
    # rule 2). The test-side spy overrides repeat the same signatures.
    entries:
      - paths: ['lib/src/integrations/testrail/testrail_client.dart']
        max_params: 12
      - paths: ['test/integrations/testrail/testrail_tools_test.dart']
        max_params: 12
      # The GitHub check-run/commit-status client methods mirror the Java
      # @MCPParam signatures 1:1 (createCheckRun takes 9 @MCPParam
      # arguments in dm.ai's GitHub.java; same AGENTS.md rule-2 parity).
      - paths: ['lib/src/integrations/github/github_client_ci_tools.dart']
        max_params: 9
      # The sync RetryPolicy mirrors the Java `RetryPolicyConfig` knobs 1:1
      # (maxAttempts/baseDelay/maxDelay/backoffMultiplier/jitterFactor,
      # the rate-limit wait cap from Java PR epam/dm.ai#624, the
      # WAIT_BEFORE_PERFORM throttle pair and the injected Random; Java
      # source is the spec per AGENTS.md rule 2) — grouping them into a
      # settings object would diverge from the parity surface.
      - paths: ['lib/src/js/sync_retry_policy.dart']
        max_params: 9
      # EngineSpec carries the independent dimensions of one engine wiring
      # (params bundle, registry, wrappers filter, working/script dirs,
      # console attribution, direct params) shared verbatim by the main
      # engine and runAsync workers (#224); named params are the API.
      - paths: ['lib/src/js/engine_factory.dart']
        max_params: 10
      # JsRunConfig is the same kind of options bag as EngineSpec above:
      # every param is an independent dimension of one run (wrappers
      # filter, registry, extra globals/params, async pool, http fetch,
      # console attribution, pre-action priming code — the last two added
      # by the sharded agents-suite runner). Named params are the API;
      # grouping them would churn every call site for no behavioral gain.
      - paths: ['lib/src/js/job_runner.dart']
        max_params: 8
  # Detect duplicated code blocks.
  duplication:
    enabled: true
    # Maximum allowed duplicated line percentage per file.
    threshold: 1.0
    # Minimum number of tokens in a block to count as duplication.
    min_tokens: 50
    # Minimum number of lines in a block to count as duplication.
    min_lines: 5
    # Glob patterns excluded from the gate.
    exclude:
      - '**.g.dart'
      - '**.freezed.dart'
      - '**.mocks.dart'
      - 'test/**'
  # Require dartdoc comments on the public API.
  public_docs:
    enabled: true
    # Glob patterns excluded from the gate.
    exclude:
      - 'test/**'
  # Limit class size (methods + weighted complexity per class).
  class_size:
    enabled: true
    max_methods: 25
    max_wmc: 80
    # The 7 Java-parity client/getter classes (Java DMTools mirrors them
    # as single classes; Java source is the spec per AGENTS.md rule 2)
    # exceed the defaults. Adopting the gate as a warning until they are
    # decomposed — new classes still show up in the report.
    severity: warning
  # Flag repeated literals per file.
  magic_constants:
    enabled: true
    flag_hex_colors: true
    # API/path literals legitimately repeat a few times across the
    # per-tool request builders; flag heavier duplication only.
    min_duplicates: 5
    min_length: 4
    exclude:
      - '**.g.dart'
      - '**.freezed.dart'
      - '**.mocks.dart'
      # Java-parity config-default walls: every getter returns a
      # literal default mirroring Java PropertyReader.
      - 'lib/src/config/property_reader_getters.dart'
      - 'lib/src/config/property_reader_ai_getters.dart'
      # Tool catalogs mirror the Java @MCPTool annotations 1:1; the
      # repeating literals are category strings in tool definitions.
      - 'lib/src/integrations/**/*_tools.dart'
      # Test fixtures repeat canned bodies/paths by design (same
      # precedent as the duplication gate, which excludes test/**).
      - 'test/**'
  # Fail tests whose bodies contain no assertions.
  test_assertions:
    enabled: true
    min_assertions: 1
  # Flag directories with loose .dart files (flat-file sprawl).
  folder_structure:
    enabled: true
    dirs: [lib]
    # 1 = the package barrel (lib/dmtools.dart), standard Dart layout.
    max_loose_files: 1
    exclude: []
  # File-level near-duplicate detection across markdown docs and Dart
  # sources (gh-447).
  similarity:
    enabled: true
    dirs: ['.']
    include:
      - '**/*.md'
      - '**/*.dart'
    jaccard: 0.5
    containment: 0.85
    exclude:
      - '.git/**'
      - '.dart_tool/**'
      - 'build/**'
      - 'coverage/**'
      - 'node_modules/**'
      - 'agents/**'

