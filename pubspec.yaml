name: dmtools
description: >-
  Pure Dart port of DMTools — enterprise dark-factory orchestrator
  (Jira, ADO, GitHub, Confluence, AI providers) with a QuickJS
  scripting runtime. See GOAL.md.
version: 0.1.81
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  archive: ^3.6.1
  crypto: ^3.0.7
  dio: ^5.4.0
  html: ^0.15.5
  native_synchronization: ^0.3.1
  path: ^1.9.0
  quickjs_runtime: ^0.3.5 # hosted on pub.dev; 0.3.5 = windows.h fix for qjs_sleep_ms (IstiN/quickjs_runtime#16)

dev_dependencies:
  test: ^1.24.0
